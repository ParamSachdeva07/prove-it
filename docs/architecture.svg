<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" width="1000" height="790" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
  <title>Prove It: architecture</title>
  <desc>The browser talks to one Python process. Conversation audio goes through the Pipecat pipeline to OpenAI. A protected tool call goes to the guard, which has Cartesia read the request and code, takes the caller's recorded answer from the recorder, and has the voice key check it.</desc>
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#3B6D11" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C0392B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="790" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#2C2C2A">Prove It: architecture</text>
  <text x="40" y="68" font-size="13" fill="#5F5E5A">One Python process. Conversation audio reaches the model; during a check, the caller's answer goes to the recorder instead.</text>

  <rect x="40" y="96" width="620" height="134" rx="14" fill="none" stroke="#888780" stroke-dasharray="6 5"/>
  <text x="60" y="120" font-size="14" font-weight="600" fill="#444441">Browser · web/src (React)</text>
  <rect x="70" y="138" width="260" height="70" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="200" y="166" font-size="15" font-weight="600" fill="#2C2C2A" text-anchor="middle">Voice key page</text>
  <text x="200" y="188" font-size="12" fill="#5F5E5A" text-anchor="middle">Records 3 sentences</text>
  <rect x="370" y="138" width="260" height="70" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="500" y="166" font-size="15" font-weight="600" fill="#2C2C2A" text-anchor="middle">Call page</text>
  <text x="500" y="188" font-size="12" fill="#5F5E5A" text-anchor="middle">Pipecat client · transcript, live check</text>

  <rect x="40" y="276" width="620" height="420" rx="14" fill="none" stroke="#1D9E75" stroke-dasharray="6 5"/>
  <text x="60" y="300" font-size="14" font-weight="600" fill="#085041">Server</text>
  <text x="644" y="684" font-size="12" fill="#0F6E56" text-anchor="end">one Python process · app/</text>

  <rect x="70" y="318" width="260" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="200" y="346" font-size="15" font-weight="600" fill="#085041" text-anchor="middle">FastAPI server</text>
  <text x="200" y="368" font-size="12" fill="#0F6E56" text-anchor="middle">server.py · API, call setup</text>
  <rect x="370" y="318" width="260" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="500" y="346" font-size="15" font-weight="600" fill="#085041" text-anchor="middle">Call pipeline + router</text>
  <text x="500" y="368" font-size="12" fill="#0F6E56" text-anchor="middle">agent.py, router.py · Pipecat</text>

  <rect x="70" y="446" width="260" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="200" y="474" font-size="15" font-weight="600" fill="#085041" text-anchor="middle">Voice key</text>
  <text x="200" y="496" font-size="12" fill="#0F6E56" text-anchor="middle">voice_key.py · voice, spoof, code</text>
  <rect x="370" y="446" width="260" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="500" y="474" font-size="15" font-weight="600" fill="#085041" text-anchor="middle">@protected tool</text>
  <text x="500" y="496" font-size="12" fill="#0F6E56" text-anchor="middle">bank.py · send_money</text>

  <rect x="70" y="590" width="260" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="200" y="618" font-size="15" font-weight="600" fill="#085041" text-anchor="middle">Recorder</text>
  <text x="200" y="640" font-size="12" fill="#0F6E56" text-anchor="middle">recorder.py · records the answer</text>
  <rect x="370" y="590" width="260" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="500" y="618" font-size="15" font-weight="600" fill="#085041" text-anchor="middle">Guard</text>
  <text x="500" y="640" font-size="12" fill="#0F6E56" text-anchor="middle">guard.py · runs the check</text>

  <rect x="712" y="276" width="248" height="420" rx="14" fill="none" stroke="#D85A30" stroke-dasharray="6 5"/>
  <text x="732" y="300" font-size="14" font-weight="600" fill="#712B13">Cloud services</text>
  <rect x="736" y="318" width="200" height="70" rx="8" fill="#FAECE7" stroke="#993C1D"/>
  <text x="836" y="346" font-size="15" font-weight="600" fill="#712B13" text-anchor="middle">OpenAI GPT-Realtime</text>
  <text x="836" y="368" font-size="12" fill="#993C1D" text-anchor="middle">Runs the conversation</text>
  <rect x="736" y="590" width="200" height="70" rx="8" fill="#FAECE7" stroke="#993C1D"/>
  <text x="836" y="618" font-size="15" font-weight="600" fill="#712B13" text-anchor="middle">Cartesia Sonic</text>
  <text x="836" y="640" font-size="12" fill="#993C1D" text-anchor="middle">Security voice</text>

  <line x1="200" y1="210" x2="200" y2="314" stroke="#185FA5" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-blue)"/>
  <text x="210" y="256" font-size="12" fill="#185FA5">3 recordings over HTTP</text>
  <line x1="200" y1="390" x2="200" y2="442" stroke="#185FA5" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-blue)"/>
  <text x="210" y="420" font-size="12" fill="#185FA5">enrol()</text>

  <line x1="500" y1="214" x2="500" y2="314" stroke="#3B6D11" stroke-width="2" marker-start="url(#a-green)" marker-end="url(#a-green)"/>
  <text x="510" y="256" font-size="12" fill="#3B6D11">your voice and the agent's, over WebRTC</text>
  <line x1="636" y1="353" x2="730" y2="353" stroke="#3B6D11" stroke-width="2" marker-start="url(#a-green)" marker-end="url(#a-green)"/>

  <line x1="500" y1="394" x2="500" y2="440" stroke="#5F5E5A" stroke-width="1.6" marker-start="url(#a-gray)" marker-end="url(#a-gray)"/>
  <text x="490" y="420" font-size="12" fill="#5F5E5A" text-anchor="end">tool call and result</text>
  <line x1="500" y1="518" x2="500" y2="586" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="510" y="556" font-size="12" fill="#5F5E5A">verify()</text>

  <path d="M368 378 H350 V606 H334" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#a-red)"/>
  <line x1="332" y1="644" x2="366" y2="644" stroke="#C0392B" stroke-width="2" marker-end="url(#a-red)"/>
  <path d="M410 588 V560 H260 V520" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#a-red)"/>
  <text x="252" y="578" font-size="12" fill="#C0392B" text-anchor="end">check(answer, code)</text>

  <line x1="636" y1="625" x2="730" y2="625" stroke="#BA7517" stroke-width="2" marker-end="url(#a-amber)"/>

  <line x1="40" y1="728" x2="72" y2="728" stroke="#3B6D11" stroke-width="2"/>
  <text x="80" y="732" font-size="12" fill="#2C2C2A">Conversation audio (reaches the model)</text>
  <line x1="330" y1="728" x2="362" y2="728" stroke="#C0392B" stroke-width="2"/>
  <text x="370" y="732" font-size="12" fill="#2C2C2A">Your answer to the code (never reaches the model)</text>
  <line x1="690" y1="728" x2="722" y2="728" stroke="#BA7517" stroke-width="2"/>
  <text x="730" y="732" font-size="12" fill="#2C2C2A">Request and code text</text>
  <line x1="40" y1="758" x2="72" y2="758" stroke="#185FA5" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="80" y="762" font-size="12" fill="#2C2C2A">HTTP: voice key setup, status, account</text>
  <line x1="330" y1="758" x2="362" y2="758" stroke="#5F5E5A" stroke-width="1.6"/>
  <text x="370" y="762" font-size="12" fill="#2C2C2A">Tool calls and results</text>
</svg>
